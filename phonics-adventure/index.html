@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
:root{font-family:Nunito,Arial,sans-serif;color:#25355c;background:#e5f8ff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 14%,#ffe7b9 0 10%,transparent 11%),radial-gradient(circle at 95% 85%,#d9d0ff 0 12%,transparent 13%),linear-gradient(140deg,#dcf6ff,#fbf9ed 64%,#ffe8ee)}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #294a88;outline-offset:3px}.app{max-width:1180px;min-height:100vh;margin:auto;padding:24px 26px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-weight:900;color:#407ca9;font-size:1rem}.score{background:#fff;border:3px solid #ffd06b;border-radius:99px;padding:8px 17px;font-size:1.1rem;font-weight:900;box-shadow:0 5px 0 #f0c05a}.stage{margin:18px auto 0;max-width:1040px;background:white;border:5px solid #fff;border-radius:34px;box-shadow:0 18px 0 #c8e4ee,0 28px 40px #5aa5be38;padding:32px 42px 40px;min-height:610px;position:relative;overflow:hidden}.stage:before{content:'✦';position:absolute;top:15px;right:32px;color:#ffc765;font-size:48px;opacity:.8}.eyebrow{font-size:1rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#6483ac}.title{font-size:clamp(2rem,4.4vw,3.6rem);line-height:1.13;margin:12px 0 12px;font-weight:900;color:#253d71}.intro{display:grid;grid-template-columns:1fr 46%;align-items:center;gap:28px;min-height:490px}.intro p{font-size:1.35rem;line-height:1.45;max-width:510px}.intro-art{display:grid;grid-template-columns:1fr 1fr;gap:12px;transform:rotate(3deg)}.intro-art img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:25px;box-shadow:0 6px 0 #b8dce9}.primary{border:0;background:#ff766c;color:white;padding:16px 35px;border-radius:21px;font-size:1.35rem;font-weight:900;box-shadow:0 7px 0 #d94e59;transition:transform .15s}.primary:hover{transform:translateY(-3px)}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 #d94e59}.mini{font-size:1rem;color:#607294;margin-top:22px}.bar{height:15px;background:#dfe9f4;border-radius:20px;overflow:hidden;margin:14px 0 20px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#50cbbc,#82db8c);border-radius:20px;transition:width .3s}.lesson{text-align:center}.sound{font-size:clamp(5rem,13vw,10rem);font-weight:900;line-height:1;color:var(--accent);margin:14px auto}.phoneme{font-size:2.6rem;font-weight:900;color:#2d517d}.hint{font-size:1.35rem;max-width:650px;margin:10px auto 23px}.examples{display:flex;justify-content:center;gap:24px}.example{display:flex;align-items:center;gap:12px;background:#edf7ff;border-radius:18px;padding:9px 20px 9px 9px;font-size:1.5rem;font-weight:900}.example img{width:66px;height:66px;object-fit:cover;border-radius:12px}.lesson .primary{margin-top:32px}.question{display:grid;grid-template-columns:45% 1fr;align-items:center;gap:40px;margin-top:10px}.picture{position:relative}.picture img{width:100%;max-width:390px;aspect-ratio:1;object-fit:cover;border-radius:28px;box-shadow:0 9px 0 #d9e8f3}.listen{display:block;border:0;background:#e4f3ff;color:#2e6e9a;padding:11px 17px;border-radius:15px;margin:16px auto 0;font-size:1.1rem;font-weight:900}.prompt{font-size:clamp(1.8rem,3vw,2.8rem);font-weight:900;line-height:1.18;margin:5px 0 20px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answer{min-height:80px;border:3px solid #b9daf3;border-radius:20px;background:#f1f9ff;color:#21426b;font-size:clamp(1.35rem,2.7vw,2.3rem);font-weight:900;transition:transform .12s,background .12s}.answer:hover{transform:translateY(-3px);background:#e7f5ff}.answer.good{background:#c9f7db;border-color:#35b978}.answer.bad{background:#ffe2e4;border-color:#ed777f;animation:shake .25s}.feedback{min-height:55px;font-size:1.22rem;font-weight:900;margin-top:18px;color:#31895f}.feedback.error{color:#cc5760}.next{margin-top:8px}.finish{text-align:center;padding:35px 0}.finish .trophy{font-size:6rem;margin:0}.finish p{font-size:1.45rem}.finish .primary{margin-top:20px}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@media(max-width:760px){.app{padding:12px 12px 28px}.stage{padding:22px 19px 30px;min-height:calc(100vh - 110px);border-radius:25px}.brand{font-size:.78rem}.score{font-size:.9rem;padding:6px 11px}.intro{display:flex;flex-direction:column-reverse;justify-content:center;gap:18px}.intro-art{width:min(75%,330px)}.intro p{font-size:1.15rem}.question{display:flex;flex-direction:column;gap:12px}.picture img{width:min(58vw,270px)}.listen{margin:8px auto 0}.prompt{margin:0 0 12px;text-align:center}.answers{width:100%;gap:9px}.answer{min-height:64px}.examples{gap:9px}.example{font-size:1.1rem;padding:5px 8px 5px 5px}.example img{width:46px;height:46px}.lesson .primary{margin-top:23px}.hint{font-size:1.1rem}}
</style></head><body><div class="app"><header class="top"><div class="brand">Учимся с Ларисой Коротаевой</div><div class="score" id="score">⭐ 0 / 16</div></header><main class="stage" id="stage" aria-live="polite"></main></div><script>
const words=[{word:'ship',sound:'sh'},{word:'fish',sound:'sh'},{word:'chick',sound:'ch'},{word:'cheese',sound:'ch'},{word:'phone',sound:'ph'},{word:'photo',sound:'ph'},{word:'three',sound:'th'},{word:'thimble',sound:'th'}];
const lessons=[{sound:'sh',ipa:'/ʃ/',hint:'Похоже на русское «ш». Скажи: ш-ш-ш!',examples:['ship','fish'],color:'#238ab9'},{sound:'ch',ipa:'/tʃ/',hint:'Похоже на русское «ч». Скажи: ч-ч-ч!',examples:['chick','cheese'],color:'#da8331'},{sound:'ph',ipa:'/f/',hint:'Похоже на русское «ф». Скажи: ф-ф-ф!',examples:['phone','photo'],color:'#7762c4'},{sound:'th',ipa:'/θ/',hint:'Кончик языка между зубами. Тихонько выдохни воздух.',examples:['three','thimble'],color:'#2e9b76'}];
let view='intro',idx=0,score=0,locked=false,firstWrong=false;const stage=document.getElementById('stage'),scoreEl=document.getElementById('score');
function say(t){if(!('speechSynthesis' in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.75;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('en-gb'));if(v)u.voice=v;speechSynthesis.speak(u)}
let audio;function tone(ok){try{audio ||=new(window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime;const notes=ok?[660,880,1100]:[210,170];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(f,now+i*.11);g.gain.setValueAtTime(.0001,now+i*.11);g.gain.exponentialRampToValueAtTime(.13,now+i*.11+.015);g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.17);o.connect(g).connect(audio.destination);o.start(now+i*.11);o.stop(now+i*.11+.19)})}catch(e){}}
function progress(n,total){return `<div class="bar" aria-label="Пройдено ${n} из ${total}"><span style="width:${n/total*100}%"></span></div>`}
function render(){scoreEl.textContent=`⭐ ${score} / 16`;if(view==='intro'){stage.innerHTML=`<div class="intro"><div><div class="eyebrow">Игра по чтению</div><h1 class="title">Приключение звуков<br>sh · ch · ph · th</h1><p>Сначала познакомься со звуками, потом помоги картинкам найти правильные буквы и слова.</p><button class="primary" id="start">Играть!</button><div class="mini">Два задания · 16 звёзд · можно пробовать снова</div></div><div class="intro-art">${['ship','chick','phone','thimble'].map(w=>`<img src="./${w}.png" alt="${w}">`).join('')}</div></div>`;document.getElementById('start').onclick=()=>{view='lesson';idx=0;render()};return}
if(view==='lesson'){const l=lessons[idx];stage.innerHTML=`<div class="lesson" style="--accent:${l.color}"><div class="eyebrow">Знакомство со звуком ${idx+1} из 4</div>${progress(idx,4)}<div class="sound">${l.sound}</div><div class="phoneme">${l.ipa}</div><p class="hint">${l.hint}</p><div class="examples">${l.examples.map(w=>`<div class="example"><img src="./${w}.png" alt="">${w}</div>`).join('')}</div><button class="primary" id="listen">🔊 Послушать слова</button><button class="listen next" id="go">${idx===3?'Начать задания':'Следующий звук'}</button></div>`;document.getElementById('listen').onclick=()=>say(l.examples.join('. '));document.getElementById('go').onclick=()=>{idx++;if(idx===4){view='soundQuiz';idx=0}else view='lesson';render()};return}
if(view==='finish'){stage.innerHTML=`<div class="finish"><div class="trophy">🏆</div><h1 class="title">Ты прочитал все слова!</h1><p>У тебя ${score} звёзд из 16. Теперь ты знаешь звуки <b>sh, ch, ph, th</b>.</p><button class="primary" id="again">Играть ещё раз</button></div>`;document.getElementById('again').onclick=()=>{view='intro';idx=0;score=0;render()};tone(true);return}
const item=words[idx],isSound=view==='soundQuiz',step=isSound?idx:idx+8;
let choices=isSound?['sh','ch','ph','th']:makeChoices(item.word,idx);
stage.innerHTML=`<div class="eyebrow">${isSound?'Задание 1 · Найди звук':'Задание 2 · Прочитай слово'} · ${idx+1} из 8</div>${progress(step,16)}<div class="question"><div class="picture"><img src="./${item.word}.png" alt="${isSound?'Картинка для выбора звука':'Картинка для выбора слова'}"><button class="listen" id="speak" aria-label="Послушать английское слово">🔊 Послушать</button></div><div><div class="prompt">${isSound?'Какие две буквы спрятались в слове?':'Какое слово подходит к картинке?'}</div><div class="answers">${choices.map((c,j)=>`<button class="answer" data-choice="${c}">${c}</button>`).join('')}</div><div class="feedback" id="feedback" role="status"></div><button class="primary next" id="next" hidden>Дальше →</button></div></div>`;
document.getElementById('speak').onclick=()=>say(item.word);stage.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b,item,isSound));document.getElementById('next').onclick=()=>{idx++;locked=false;firstWrong=false;if(idx===8){view=isSound?'wordQuiz':'finish';idx=0}render()};}
function makeChoices(correct,i){let pool=words.filter(x=>x.word!==correct&&x.sound!==words[i].sound).map(x=>x.word);return [correct,pool[(i*2)%pool.length],pool[(i*2+3)%pool.length],pool[(i*2+5)%pool.length]].sort((a,b)=>hash(a,i)-hash(b,i))}
function hash(t,i){return [...t].reduce((a,c)=>a*31+c.charCodeAt(0),i*7)%101}
function answer(button,item,isSound){if(locked)return;let good=button.dataset.choice===(isSound?item.sound:item.word),feedback=document.getElementById('feedback');if(good){button.classList.add('good');locked=true;if(!firstWrong){score++;scoreEl.textContent=`⭐ ${score} / 16`}tone(true);say(item.word);feedback.className='feedback';feedback.textContent=`Верно! ${item.word} — ${item.sound}`;document.getElementById('next').hidden=false}else{button.classList.add('bad');firstWrong=true;tone(false);feedback.className='feedback error';feedback.textContent='Попробуй ещё раз';setTimeout(()=>button.classList.remove('bad'),450)}}
render();
</script></body></html>
